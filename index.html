<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>চলো ইংলিশ শিখি</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#2358d8,#6b45d9);color:#fff;padding:28px 18px}header h1{margin:0;font-size:30px}header p{margin:7px 0 0;opacity:.9}.wrap{max-width:1050px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:230px 1fr;gap:16px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 22px #14213d12;margin-bottom:14px}.nav button{display:block;width:100%;text-align:left;border:0;background:#f1f4fa;padding:12px;border-radius:11px;margin:7px 0;font-size:15px;cursor:pointer}.nav button.active{background:#e5edff;color:#1749c5;font-weight:700}.pill{display:inline-block;background:#eef3ff;color:#2457d6;padding:6px 10px;border-radius:99px;font-size:13px;margin:3px}.q{font-size:21px;font-weight:700;margin:14px 0}.answer{width:100%;min-height:120px;border:1px solid #d5dbea;border-radius:12px;padding:13px;font-size:16px;resize:vertical}.btn{border:0;background:#2457d6;color:white;padding:11px 16px;border-radius:11px;font-weight:700;cursor:pointer;margin:6px 4px 0 0}.btn.alt{background:#edf1fa;color:#2457d6}.feedback{margin-top:14px;padding:14px;border-radius:12px;background:#f3f8f3}.bad{background:#fff1f1}.good{color:#16834b;font-weight:700}.hidden{display:none}.stat{display:inline-block;min-width:130px;padding:15px;margin:5px;background:#f5f7fb;border-radius:13px}.mistake{border-left:4px solid #e05252;padding:12px;margin:10px 0;background:#fff8f8;border-radius:10px}.mistake b{display:block;margin-bottom:4px}.topic{font-weight:700}.small{font-size:13px;color:#697386}.list{line-height:1.8}.search{width:100%;padding:11px;border:1px solid #d5dbea;border-radius:10px}.footer{text-align:center;color:#778096;font-size:13px;padding:15px}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav{display:flex;overflow:auto;gap:7px}.nav button{min-width:max-content;margin:0}}
</style></head><body><header><div class="wrap"><h1>🇬🇧 চলো ইংলিশ শিখি</h1><p>Daily English & IELTS Practice Hub — Practice • Correct • Improve</p></div></header><div class="wrap"><div class="grid"><aside class="card nav" id="nav"></aside><main id="app"></main></div><div class="footer">Your practice is saved on this device. You can share this website file with friends.</div></div>
<script>
const data={
 mistakes:[
 ['He practice English every day.','He practices English every day.','Present simple-এ he/she/it হলে verb-এ s/es লাগে.'],
 ['He doesn’t practices English.','He doesn’t practice English.','doesn’t-এর পরে base verb হয়.'],
 ['Technology makes people’s lives more easier.','Technology makes people’s lives easier.','easier নিজেই comparative; more + easier একসাথে নয়.'],
 ['Regular exercise makes people good health.','Regular exercise keeps people healthy.','make + object + adjective / keep + object + adjective ব্যবহার করো.'],
 ['Regularly, books makes students...','Regular reading makes students...','Subject যদি singular হয় verb agreement ঠিক রাখতে হবে; natural noun phrase ব্যবহার করো.'],
 ['It will becoming increasingly traffic congestion.','It will cause increasing traffic congestion.','will-এর পরে base verb: will cause, not will becoming.']
 ],
 speaking:[
 ['Daily Life','What time do you usually wake up?'],['Study','How do you usually practise English?'],['Family','How do you usually spend time with your family?'],['Friends','What do you like doing with your friends?'],['Future','What do you want to achieve in the next year?'],['Technology','How does technology help students?']
 ],
 writing:[
 ['Task 2','Some people think parents should organise free-time activities for their children. To what extent do you agree or disagree?'],
 ['Task 2','Some people believe online learning is more effective than classroom learning. Discuss both views and give your opinion.'],
 ['Task 2','Regular exercise is important for maintaining a healthy lifestyle. What are the benefits of regular exercise?']
 ],
 grammar:[
 ['Present Simple','I practice English every day.'],['Present Continuous','I am studying English now.'],['Questions','Does your brother walk every morning?'],['Negative','My brother doesn’t walk every morning.'],['Sentence building','Regular practice makes students feel confident.']
 ]
};
let state=JSON.parse(localStorage.getItem('choloEnglish')||'{}');state.answers=state.answers||[];state.score=state.score||0;state.section=state.section||'home';
const app=document.getElementById('app'),nav=document.getElementById('nav');
function save(){localStorage.setItem('choloEnglish',JSON.stringify(state));}
function menu(){let items=[['home','🏠 Dashboard'],['speaking','🗣️ Speaking'],['writing','✍️ Writing'],['grammar','📚 Grammar'],['mistakes','❌ My Mistakes'],['vocab','📝 Vocabulary']];nav.innerHTML=items.map(x=>`<button class="${state.section==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(s){state.section=s;save();menu();render()}
function render(){if(state.section==='home')home();if(state.section==='speaking')practice('speaking');if(state.section==='writing')writing();if(state.section==='grammar')practice('grammar');if(state.section==='mistakes')mistakes();if(state.section==='vocab')vocab()}
function home(){app.innerHTML=`<div class="card"><h2>Welcome! 👋</h2><p>এটা তোমার personal English practice dashboard. প্রতিদিন অল্প করে practice করো.</p><div class="stat"><b>${state.score}</b><br><span class="small">Practice points</span></div><div class="stat"><b>${state.answers.length}</b><br><span class="small">Answers saved</span></div><div class="stat"><b>${data.mistakes.length}</b><br><span class="small">Common mistakes</span></div></div><div class="card"><h3>🎯 Today’s plan</h3><div class="list">1. Speaking — 5 questions<br>2. Grammar — 5 sentences<br>3. Mistake Revision — 3 mistakes<br>4. Writing — 1 paragraph</div><button class="btn" onclick="go('speaking')">Start Practice →</button></div><div class="card"><h3>📌 Your main focus</h3><span class="pill">Tense</span><span class="pill">Sentence formation</span><span class="pill">Subject–verb agreement</span><span class="pill">Natural English</span><span class="pill">IELTS Speaking</span><span class="pill">IELTS Writing</span></div>`}
function practice(type){let arr=data[type],i=state[type+'Index']||0;let item=arr[i%arr.length];let label=type==='speaking'?item[0]:item[0];let q=type==='speaking'?item[1]:item[1];app.innerHTML=`<div class="card"><span class="pill">${label}</span><div class="q">${q}</div><textarea class="answer" id="ans" placeholder="Write your answer in English..."></textarea><br><button class="btn" onclick="check('${type}',${i%arr.length})">Submit Answer</button><button class="btn alt" onclick="next('${type}')">Next Question</button><div id="fb"></div></div><div class="card"><h3>💡 Tip</h3><p>একটা complete sentence লেখো. কারণ/উদাহরণ যোগ করলে answer আরও natural হবে.</p></div>`}
function check(type,i){let v=document.getElementById('ans').value.trim();if(!v)return;state.answers.push({type,text:v,at:new Date().toLocaleString()});state.score+=Math.min(10,Math.max(2,Math.floor(v.split(/\s+/).length/2)));save();let fb=document.getElementById('fb');let words=v.split(/\s+/).filter(Boolean).length;fb.innerHTML=words<5?`<div class="feedback bad"><b>Try again.</b> Answer-টা একটু বড় করো. অন্তত 2–3 sentences লেখার চেষ্টা করো.</div>`:`<div class="feedback"><span class="good">✓ Good effort!</span><br>তোমার answer saved হয়েছে. আরও natural করতে <b>because, but, so, for example</b> দিয়ে idea connect করার চেষ্টা করো.</div>`}
function next(type){state[type+'Index']=((state[type+'Index']||0)+1)%data[type].length;save();render()}
function writing(){let i=state.writingIndex||0,q=data.writing[i%data.writing.length];app.innerHTML=`<div class="card"><span class="pill">${q[0]}</span><div class="q">${q[1]}</div><textarea class="answer" id="essay" style="min-height:260px" placeholder="Write your IELTS answer here..."></textarea><br><button class="btn" onclick="saveWriting()">Save Practice</button><button class="btn alt" onclick="next('writing')">Next Question</button><div id="wfb"></div></div><div class="card"><h3>🧠 Writing checklist</h3><div class="list">✓ Clear introduction<br>✓ Topic sentence<br>✓ Explanation + example<br>✓ Linking words<br>✓ Subject–verb agreement<br>✓ Tense consistency</div></div>`}
function saveWriting(){let v=document.getElementById('essay').value.trim();if(!v)return;state.answers.push({type:'IELTS Writing',text:v,at:new Date().toLocaleString()});state.score+=5;save();document.getElementById('wfb').innerHTML='<div class="feedback"><span class="good">✓ Saved!</span> তোমার writing practice এই device-এ save হয়েছে.</div>'}
function mistakes(){app.innerHTML=`<div class="card"><h2>❌ My Common Mistakes</h2><p class="small">এগুলো তোমার আগের practice-এ বারবার দেখা ভুলের ধরন ধরে তৈরি করা revision set.</p>${data.mistakes.map((m,i)=>`<div class="mistake"><b>${i+1}. ❌ ${m[0]}</b><b>✅ ${m[1]}</b><span>${m[2]}</span></div>`).join('')}<button class="btn" onclick="mistakeQuiz()">Practice These Mistakes →</button></div>`}
function mistakeQuiz(){let i=Math.floor(Math.random()*data.mistakes.length),m=data.mistakes[i];app.innerHTML=`<div class="card"><span class="pill">Mistake Revision</span><div class="q">Correct this sentence:</div><p><b>${m[0]}</b></p><input class="search" id="fix" placeholder="Write the corrected sentence..."><br><button class="btn" onclick="gradeMistake(${i})">Check</button><div id="mfb"></div></div>`}
function gradeMistake(i){let v=document.getElementById('fix').value.trim().toLowerCase();let target=data.mistakes[i][1].toLowerCase();let ok=v.replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()===target.replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();document.getElementById('mfb').innerHTML=ok?'<div class="feedback"><span class="good">✓ Correct!</span> Excellent.</div>':`<div class="feedback bad">Not quite.<br><b>Correct:</b> ${data.mistakes[i][1]}<br><span class="small">${data.mistakes[i][2]}</span></div>`;if(ok){state.score+=3;save()}}
function vocab(){app.innerHTML=`<div class="card"><h2>📝 Vocabulary</h2><p>এই section-এ নতুন vocabulary যোগ করার জন্য নিচের box ব্যবহার করো.</p><input class="search" id="word" placeholder="Word / phrase"><br><input class="search" id="meaning" placeholder="Bangla meaning / example"><br><button class="btn" onclick="addWord()">Add Vocabulary</button><div id="words"></div></div>`;showWords()}
function addWord(){let w=document.getElementById('word').value.trim(),m=document.getElementById('meaning').value.trim();if(!w)return;state.vocab=state.vocab||[];state.vocab.push([w,m]);save();document.getElementById('word').value='';document.getElementById('meaning').value='';showWords()}
function showWords(){let a=state.vocab||[];document.getElementById('words').innerHTML=a.length?a.map((x,i)=>`<div class="mistake"><b>${x[0]}</b><span>${x[1]||''}</span></div>`).join(''):'<p class="small">No vocabulary added yet.</p>'}
menu();render();
</script></body></html>
